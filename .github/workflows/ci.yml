name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install React ${{ matrix.react }}
        if: matrix.react != 19
        run: >
          npm install --no-save
          react@${{ matrix.react }} react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
